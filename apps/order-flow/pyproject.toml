[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-flow-lab"
version = "0.1.0"
description = "A local learning lab for async APIs, messaging, and idempotency"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncmy>=0.2,<1",
  "alembic>=1.13,<2",
  "aio-pika>=9.4,<10",
  "fastavro>=1.9,<2",
  "celery>=5.4,<6",
]

[project.optional-dependencies]
test = ["aiosqlite>=0.20,<1", "httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"
