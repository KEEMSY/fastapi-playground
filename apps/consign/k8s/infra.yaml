# Postgres·Redis·RabbitMQ. ponytail: 저장소는 emptyDir 라 Pod 가 죽으면 데이터도 사라진다.
# 실제로는 관리형 DB(RDS 등)를 쓰거나 StatefulSet + PVC
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init }
data:
  init.sql: "CREATE DATABASE settlement;"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: consign }
            - { name: POSTGRES_PASSWORD, value: consign }
            - { name: POSTGRES_DB, value: consign }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "consign"] }
            periodSeconds: 2
          volumeMounts: [{ name: init, mountPath: /docker-entrypoint-initdb.d }]
      volumes: [{ name: init, configMap: { name: postgres-init } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq }
spec:
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672 }, { name: ui, port: 15672 }]
