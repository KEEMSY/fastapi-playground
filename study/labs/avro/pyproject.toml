[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avro-learning-lab"
version = "0.1.0"
description = "Hands-on exercises for Avro serialization and schema evolution"
requires-python = ">=3.12"
dependencies = ["fastavro>=1.9,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
